[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drum-tracker-sorter"
version = "0.1.0"
description = "Utility script that normalizes, updates metadata, and sorts drumless / isolated drum tracks."
authors = [
  { name = "Gabriel Fávero" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "mutagen>=1.47.0"
]

[project.scripts]
drum-tracker-sorter = "drum-tracker-sorter:process_songs"
